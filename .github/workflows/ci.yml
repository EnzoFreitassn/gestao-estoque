name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Valores dummy: o build/testes não acessam o banco de verdade.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/estoque?schema=public"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/estoque?schema=public"
      AUTH_SECRET: "ci-dummy-secret-0123456789abcdef0123456789abcdef"
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Testes (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build
